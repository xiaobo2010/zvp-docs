site_name: ZVP 平台开发文档
site_description: 镇海中学义工管理平台（ZVMS / ZVP）的 API 与开发文档
site_url: https://xiaobo2010.github.io/zvp-docs/
repo_url: https://github.com/xiaobo2010/zvp-docs
repo_name: xiaobo2010/zvp-docs
edit_uri: edit/main/docs/
copyright: ZVP 平台文档 · 镇海中学义工管理平台

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.critic
  - pymdownx.keys

plugins:
  - search:
      lang:
        - zh
        - en

nav:
  - 首页: index.md
  - 快速开始: getting-started.md
  - 架构总览: architecture.md
  - API 参考:
      - 约定: api/index.md
      - 基础层:
          - 用户: api/users.md
          - 分组: api/groups.md
          - 日志: api/logs.md
          - 附件: api/attachments.md
          - 系统: api/system.md
          - 导入导出: api/transfers.md
          - 更新日志: api/changelog.md
      - v2:
          - 用户: api/users_v2.md
          - 分组: api/groups_v2.md
          - 活动: api/activities_v2.md
          - 时长: api/times.md
          - 统计: api/statistics.md
          - MCP: api/mcp.md
      - v3:
          - 用户: api/users_v3.md
          - 分组: api/groups_v3.md
          - 活动: api/activities_v3.md
  - 开发指南:
      - 后端: dev/backend.md
      - 前端: dev/frontend.md
      - 数据库: dev/database.md
